<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bodycam Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout : le rendu occupe tout l'écran, l'interface flotte dessus comme celle d'une app caméra */
  --ink:#f3f0e8;
  --ink-dim:rgba(243,240,232,.72);
  --scrim:rgba(14,17,13,.52);
  --line:rgba(243,240,232,.24);
  --rec:#ff4b3e;
  --bg:#0c0f0b;
  --f-ui:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--bg)}
#view.drag{cursor:grabbing}
.hud{position:fixed;left:0;right:0;display:flex;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));pointer-events:none;align-items:center}
.hud.top{top:0;padding-top:calc(14px + env(safe-area-inset-top,0px));justify-content:space-between}
.hud.bottom{bottom:0;flex-direction:column;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));gap:12px}
.chip{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em;font-variant-numeric:tabular-nums;
  background:var(--scrim);border-radius:999px;padding:6px 11px;display:flex;align-items:center;gap:7px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.osd{font-family:var(--f-mono);font-size:12px;line-height:1.45;letter-spacing:.03em;text-align:right;display:flex;flex-direction:column;
  font-variant-numeric:tabular-nums;text-shadow:0 0 3px rgba(0,0,0,.9),0 1px 2px rgba(0,0,0,.8)}
.hint{font-size:13px;color:var(--ink-dim);text-shadow:0 1px 6px rgba(0,0,0,.7);transition:opacity .6s}
.hint.off{opacity:0}
.pensee{max-width:34em;text-align:center;font-size:16px;line-height:1.35;font-style:italic;color:var(--ink);
  text-shadow:0 0 4px rgba(0,0,0,.95),0 1px 8px rgba(0,0,0,.8);opacity:0;transition:opacity .5s;text-wrap:balance}
.pensee.on{opacity:1}
.dit{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);z-index:3;width:calc(100% - 32px);max-width:34em;text-align:center;
  font-size:15px;line-height:1.35;font-style:italic;color:var(--ink-dim);text-shadow:0 0 4px rgba(0,0,0,.95),0 1px 8px rgba(0,0,0,.8);opacity:0;transition:opacity .4s;
  text-wrap:balance;pointer-events:none;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dit.on{opacity:1}
#parler,#mic{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#parler.tenu,#mic.tenu{outline:2px solid var(--rec);outline-offset:2px}
.dit{font-size:clamp(18px,2.7vw,30px)}.pensee{font-size:clamp(17px,2.3vw,26px)}
@media (min-width:700px){.dit,.pensee{max-width:40em}}
.dire{display:flex;gap:8px;width:100%;max-width:30em;pointer-events:auto}
.dire[hidden]{display:none}
.dire input{flex:1;min-width:0;font:500 16px/1.2 var(--f-ui);color:var(--ink);background:var(--scrim);border:1px solid var(--line);
  border-radius:999px;padding:12px 16px;-webkit-user-select:text;user-select:text;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dire input::placeholder{color:var(--ink-dim)}
.dire input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dire button{min-width:0}
.dire .mic[hidden]{display:none}
.dire .mic[aria-pressed="true"]{background:var(--rec);border-color:var(--rec)}
button:disabled{opacity:.5}
.row{display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
button{font:600 15px/1 var(--f-ui);color:var(--ink);background:var(--scrim);border:1px solid var(--line);
  border-radius:999px;padding:13px 18px;min-width:0;cursor:pointer;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button.ghost{min-width:0;font-weight:500;color:var(--ink-dim)}
button:active{background:rgba(243,240,232,.2)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#mesure[hidden]{display:none}
#mesure{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(12,15,11,.86)}
#mesure{z-index:30}
#mesure.banc pre{font-size:clamp(11px,1.6vw,17px);line-height:1.45;max-height:82%;white-space:pre;overflow:auto}
#mesure pre{margin:0;max-width:100%;max-height:72%;overflow:auto;font:400 12.5px/1.6 var(--f-mono);white-space:pre-wrap;-webkit-user-select:text;user-select:text;font-variant-numeric:tabular-nums}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:left;
  background:var(--bg);font-family:var(--f-mono);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow:auto}
/* meneur de jeu : bouton qui pulse quand le porteur pose une question, écran de fin, ligne de mise au point (CFG.debug) */
button.pulse{animation:pulse 1.4s ease-in-out infinite;border-color:var(--ink)}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(243,240,232,.22)}}
#fin[hidden]{display:none}
#fin{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(12,15,11,.35),rgba(12,15,11,.88) 60%)}
#fin .fin-sur{margin:0;font:500 12px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim)}
#fin h2{margin:0;font:600 30px/1.1 var(--f-ui);text-wrap:balance}
#fin p#fin-texte{margin:0 0 10px;max-width:26em;font-size:15px;line-height:1.4;font-style:italic;color:var(--ink-dim);text-wrap:balance}
#debug-meneur{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(84px + env(safe-area-inset-top,0px));
  font:400 10.5px/1.4 var(--f-mono);color:var(--ink-dim);text-shadow:0 1px 2px rgba(0,0,0,.9);pointer-events:none;z-index:3}
#debug-meneur.sur-ouv{z-index:25;color:var(--ink);background:rgba(7,9,6,.72);padding:8px 10px;border-radius:10px;white-space:pre-wrap;max-height:70vh;overflow:hidden}
/* constructeur de monde : banque de scènes, en tiroir sur téléphone (bas de l'écran), en panneau à droite sur ordinateur */
.banque[hidden],.chantier[hidden],.chantier-puce[hidden],.banque-alerte[hidden]{display:none}
.banque{position:fixed;left:0;right:0;bottom:0;z-index:8;max-height:min(84vh,84dvh);overflow:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(14,17,13,.95);border-top:1px solid var(--line);border-radius:18px 18px 0 0;-webkit-user-select:text;user-select:text;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media (min-width:760px){.banque{left:auto;top:0;width:410px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);padding-top:calc(16px + env(safe-area-inset-top,0px))}}
.banque-tete{display:flex;align-items:center;gap:10px}
.banque-tete h2{margin:0;font:600 19px/1.2 var(--f-ui);flex:1}
.banque-mode{font:400 11px/1 var(--f-mono);color:var(--ink-dim);letter-spacing:.04em;text-transform:uppercase}
.banque-tete button{padding:10px 14px}
.banque-alerte{margin:0;font-size:13px;line-height:1.4;color:#ffd6a0}
.banque-nouvelle{display:flex;flex-direction:column;gap:8px}
.banque-nouvelle label{font:500 12px/1 var(--f-mono);color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em}
.banque textarea,.carte-form input{font:500 16px/1.35 var(--f-ui);color:var(--ink);background:rgba(243,240,232,.07);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;min-height:44px}
.banque textarea:focus-visible,.carte-form input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.row.gauche{justify-content:flex-start}
#taire{pointer-events:auto;padding:8px 14px;font-size:13px}
.banque button{padding:11px 15px;font-size:14px;min-height:44px}
button.danger{border-color:var(--rec);color:#ffb3ab}
.chantier{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:rgba(243,240,232,.05)}
.chantier-tete{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.chantier-temps{font:400 12px/1.4 var(--f-mono);color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (min-width:760px){body.banque-ouverte .hud.bottom{right:410px}}
.chantier-etapes{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chantier-etapes li{font:500 12px/1 var(--f-mono);padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim)}
.chantier-etapes li.fait{color:var(--ink);border-color:rgba(243,240,232,.5)}
.chantier-etapes li.actif{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.chantier-etapes li.echec{color:#fff;background:var(--rec);border-color:var(--rec)}
.chantier-texte{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink)}
.chantier-vues{display:flex;gap:6px}
.chantier-vues img{height:92px;border-radius:6px;border:1px solid var(--line)}
.chantier-puce{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:6;font:500 12.5px/1 var(--f-mono);padding:10px 14px;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banque-liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.banque-liste .vide{font-size:13.5px;line-height:1.45;color:var(--ink-dim);padding:6px 2px}
.carte{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.carte.courante{border-color:rgba(243,240,232,.7)}
.carte-tete{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:8px;cursor:pointer;align-items:flex-start}
.carte-tete:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.carte-tete:active{background:rgba(243,240,232,.08)}
.carte-vignette{flex:none;width:54px;height:96px;border-radius:8px;overflow:hidden;background:#2a2f27}
.carte-vignette.jour{background:linear-gradient(#8b98a3,#6d6f5f 55%,#3d3a30)}
.carte-vignette.nuit{background:linear-gradient(#07090d,#151a1d 60%,#26231c)}
.carte-vignette img{width:100%;height:100%;object-fit:cover;display:block}
.carte-txt{display:flex;flex-direction:column;gap:4px;min-width:0;padding-top:2px}
.carte-txt strong{font:600 15px/1.25 var(--f-ui)}
.carte-meta{font:400 11.5px/1.3 var(--f-mono);color:var(--ink-dim)}
.carte-desc{font-size:13px;line-height:1.35;color:var(--ink-dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.carte-actions{display:flex;flex-direction:column;gap:8px;padding:0 8px 10px}
.carte-form{display:flex;gap:6px;flex-wrap:wrap}
.carte-form input{flex:1 1 180px;min-width:0;padding:9px 12px}
.carte-hist summary{font:500 12px/1.4 var(--f-mono);color:var(--ink-dim);cursor:pointer;padding:4px 0}
.carte-hist ul{margin:4px 0 0;padding-left:16px;font:400 11.5px/1.45 var(--f-mono);color:var(--ink-dim)}
/* commandes du bas : trois boutons au pouce ; le reste (réglages, essais du moteur) dans « Plus », qui s'ouvre au-dessus */
.commandes{flex-wrap:nowrap;max-width:100%}
.commandes button{white-space:nowrap}
.outils[hidden]{display:none}
.outils{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:30em;padding:10px;border-radius:18px;
  background:rgba(14,17,13,.82);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.credit-sons{flex-basis:100%;text-align:center;font-size:11px;opacity:.7}
.outils button{padding:11px 14px;font-size:14px;min-height:44px}
#plus[aria-expanded="true"]{color:var(--ink);border-color:var(--ink)}
.banque-liste .groupe{font:500 11.5px/1 var(--f-mono);color:var(--ink-dim);text-transform:uppercase;letter-spacing:.08em;padding:10px 2px 2px}
/* ouverture de démo (src/ouverture.js) : la question, puis le journal de préparation qui défile, puis le fondu sur le monde */
.ouv{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;background:radial-gradient(120% 90% at 50% 18%,#161b14 0%,var(--bg) 62%,#070906 100%);
  transition:opacity 2.2s ease,background-color .6s;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
.ouv[hidden]{display:none}
.ouv.ouv-fondu{opacity:0;pointer-events:none}
.ouv-cadre{width:100%;max-width:620px;display:flex;flex-direction:column;min-height:0;padding-top:max(5vh,calc(50vh - 340px));transition:padding-top .7s ease}
.ouv-travail .ouv-cadre{padding-top:28px}
.ouv-marque{margin:0 0 30px;transition:opacity .5s ease,margin .6s ease,max-height .6s ease;max-height:320px;overflow:hidden}
.ouv-nom{margin:0 0 8px;font:600 clamp(38px,9vw,68px)/1 var(--f-ui);letter-spacing:-.025em;text-wrap:balance}
.ouv-concept{margin:0 0 12px;font:500 clamp(11.5px,1.5vw,14px)/1.35 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--rec)}
.ouv-expl{margin:0;max-width:34em;font:400 clamp(14.5px,1.7vw,17px)/1.5 var(--f-ui);color:var(--ink-dim);text-wrap:pretty}
.ouv-travail .ouv-marque{max-height:0;margin:0;opacity:0}
@media (max-height:640px){.ouv-expl{display:none}.ouv-marque{margin-bottom:18px}}
.ouv-sur{margin:0 0 14px;font:500 11.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);display:flex;align-items:center;gap:9px}
.ouv-pt{width:7px;height:7px;border-radius:50%;background:var(--rec);box-shadow:0 0 10px var(--rec)}
.ouv-q{margin:0 0 18px;font:600 24px/1.12 var(--f-ui);letter-spacing:-.01em;text-wrap:balance;transition:font-size .6s ease,margin .6s ease,color .6s}
@media (min-width:760px){.ouv-q{font-size:30px}}
.ouv-travail .ouv-q{font-size:15px;margin:0 0 10px;color:var(--ink-dim);font-weight:500}
.ouv-form{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(243,240,232,.045)}
.ouv-form:focus-within{border-color:rgba(243,240,232,.55)}
.ouv-form textarea{font:500 18px/1.4 var(--f-ui);color:var(--ink);background:transparent;border:0;resize:none;outline:none;min-height:54px;padding:4px 4px 0}
.ouv-form textarea::placeholder{color:rgba(243,240,232,.45)}
.ouv-actions{display:flex;justify-content:flex-end;gap:8px}
.ouv-actions button{min-height:44px;padding:0 20px}
#ouv-go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ouv-sugg{margin:14px 2px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font:400 13px/1.4 var(--f-ui);color:var(--ink-dim)}
.ouv-chip{font:500 14px/1.35 var(--f-ui);text-align:left;padding:9px 13px;min-height:40px;border-radius:12px;color:var(--ink);background:rgba(243,240,232,.06);border:1px dashed rgba(243,240,232,.32);max-width:100%}
.ouv-travail .ouv-form,.ouv-travail .ouv-sugg{display:none}
.ouv-demande{align-self:flex-end;max-width:85%;margin:2px 0 14px;padding:10px 14px;border-radius:16px 16px 4px 16px;background:rgba(243,240,232,.1);font:500 16px/1.35 var(--f-ui)}
.ouv-pense{margin:0 0 12px;font-size:15px;line-height:1.45;color:var(--ink);font-style:italic}
.ouv-log{list-style:none;margin:0;padding:0 2px 6px;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px);mask-image:linear-gradient(to bottom,transparent 0,#000 22px)}
.ouv-log::-webkit-scrollbar{display:none}
.ouv-etape{animation:ouvApparait .35s ease both}
.ouv-et{display:flex;align-items:center;gap:10px;font:600 14px/1.2 var(--f-ui)}
.ouv-compte{margin-left:auto;font:400 12px/1 var(--f-mono);color:var(--ink-dim);font-variant-numeric:tabular-nums}
.ouv-roue{width:14px;height:14px;flex:none;border-radius:50%;border:2px solid rgba(243,240,232,.25);border-top-color:var(--ink);animation:ouvTourne .8s linear infinite}
.ouv-etape.fait .ouv-roue{animation:none;border:0;background:var(--ink);-webkit-mask:radial-gradient(circle,#000 38%,transparent 42%);mask:radial-gradient(circle,#000 38%,transparent 42%)}
.ouv-etape.fait .ouv-titre{color:var(--ink-dim)}
.ouv-items{list-style:none;margin:8px 0 0 24px;padding:0;display:flex;flex-direction:column;gap:6px}
.ouv-it{font:400 12.5px/1.45 var(--f-mono);color:var(--ink);animation:ouvApparait .3s ease both;overflow-wrap:anywhere}
.ouv-k{color:var(--ink-dim);margin-right:6px}
.ouv-dom{color:var(--ink-dim)}
.ouv-src{font-family:var(--f-ui);font-size:13.5px}
.ouv-etat{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--ink-dim)}
.ouv-lu{color:var(--ink);border-color:rgba(243,240,232,.5)}
.ouv-constat{display:flex;flex-direction:column;gap:2px}
.ouv-c{font:500 14px/1.4 var(--f-ui)}
.ouv-r{color:var(--ink-dim);font-size:12px}
.ouv-photos{margin-left:-24px;overflow:hidden}
.ouv-bande{overflow:hidden;padding:8px 2px 4px;min-height:142px}
@media (min-width:760px){.ouv-bande{min-height:157px}}
.ouv-rail{display:flex;gap:10px;align-items:flex-start;transition:transform .45s cubic-bezier(.2,.7,.2,1);will-change:transform}
.ouv-vg{flex:none;width:112px;margin:0;transform:rotate(var(--r,0deg));animation:ouvVg .22s ease-out both}
@media (min-width:760px){.ouv-vg{width:132px}}
.ouv-vg-img{position:relative;overflow:hidden;aspect-ratio:4/3;border-radius:4px;background:#1b2018;outline:1px solid rgba(243,240,232,.18);outline-offset:2px}
.ouv-vg-img img{display:block;width:100%;height:100%;object-fit:cover}
.ouv-vg-img::after{content:"";position:absolute;left:0;right:0;top:0;height:34%;background:linear-gradient(to bottom,transparent,rgba(243,240,232,.38),transparent);transform:translateY(-110%);opacity:0}
.ouv-vg.lecture .ouv-vg-img{outline-color:var(--ink)}
.ouv-vg.lecture .ouv-vg-img::after{opacity:1;animation:ouvBalaye .5s linear infinite}
.ouv-vg figcaption{margin-top:6px;font:400 10.5px/1.35 var(--f-mono);color:var(--ink);min-height:2.7em;overflow-wrap:anywhere}
.ouv-vg.ecartee .ouv-vg-img{opacity:.38;filter:grayscale(1)}
.ouv-vg.ecartee figcaption{color:var(--ink-dim)}
.ouv-vg.epinglee .ouv-vg-img{outline-color:var(--rec)}
.ouv-credit{margin:4px 0 0 2px;font:400 10px/1.4 var(--f-mono);color:var(--ink-dim)}
.ouv-constat.avec-photo{position:relative;padding-left:48px;min-height:38px}
.ouv-epingle{position:absolute;left:0;top:2px;width:40px;height:30px;object-fit:cover;border-radius:3px;outline:1px solid var(--rec);outline-offset:1px;transform:rotate(-3deg);animation:ouvEpingle .35s ease-out both}
.ouv-credits details{font:400 10.5px/1.45 var(--f-mono);color:var(--ink-dim)}
.ouv-credits summary{cursor:pointer}
.ouv-credits ul{margin:4px 0 0;padding-left:16px}
.ouv-credits a{color:var(--ink-dim)}
@keyframes ouvVg{from{opacity:0;transform:translateY(10px) rotate(var(--r,0deg)) scale(.92)}to{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes ouvBalaye{to{transform:translateY(310%)}}
@keyframes ouvEpingle{from{opacity:0;transform:translateY(-6px) rotate(-8deg) scale(1.3)}to{opacity:1;transform:rotate(-3deg)}}
/* fenêtre large (démo sur PC) : le journal à gauche, la planche de photos à droite, vignettes plus grandes en mosaïque */
.ouv-large .ouv-cadre{max-width:1480px;display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);grid-template-rows:auto auto auto auto auto minmax(0,1fr) auto;column-gap:44px;align-content:stretch}
.ouv-large .ouv-cadre>*{grid-column:1}
.ouv-large .ouv-log{grid-row:6}
.ouv-large .ouv-planche{grid-column:2;grid-row:1/-1;align-self:start;min-width:0;padding-top:2px;animation:ouvApparait .4s ease both}
.ouv-planche-t{margin:0 0 6px;font:500 11.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
.ouv-planche .ouv-bande{min-height:0;padding:10px 8px 6px}
.ouv-planche .ouv-rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 14px;transform:none;transition:none}
.ouv-planche .ouv-vg{width:auto}
.ouv-planche .ouv-vg figcaption{font-size:11.5px;min-height:2.8em}
.ouv-planche .ouv-credit{font-size:11px;margin-top:8px}
.ouv-planche .ouv-credits{margin-top:6px}
.ouv-planche .ouv-credits details{font-size:11px}
.ouv-mention{margin:10px 0 0;font:400 11px/1.4 var(--f-mono);letter-spacing:.04em;color:var(--ink-dim)}
.ouv-passer{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;min-height:36px;padding:0 14px;font-size:13px}
.ouv-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes ouvTourne{to{transform:rotate(360deg)}}
@keyframes ouvApparait{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ouv-roue,.ouv-etape,.ouv-it,.ouv-vg,.ouv-epingle,.ouv-vg-img::after{animation:none}.ouv-rail{transition:none}.ouv{transition:opacity .4s}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
@media (prefers-reduced-motion:reduce){button.pulse{animation:none}}
</style>
</head>
<body>
<canvas id="view" aria-label="Vue de la forêt générée. Glisser pour regarder autour de soi."></canvas>
<div class="hud top">
  <div class="chip"><span class="dot"></span><span id="rec">00:00</span></div>
  <div class="osd"><span id="clock">----</span><span id="camid">CAM 07</span><span id="stat">MISE AU POINT</span></div>
</div>
<div class="dit" id="dit" aria-live="off"></div>
<div class="hud bottom">
  <div class="pensee" id="pensee" aria-live="polite"></div>
  <button id="taire" type="button" class="ghost" hidden>Silence</button>
  <div class="hint" id="hint">Glisse pour regarder autour de lui</div>
  <form class="dire" id="dire" hidden>
    <button id="mic" type="button" class="mic" aria-pressed="false" hidden>Micro</button>
    <input id="msg" type="text" autocomplete="off" enterkeyhint="send" placeholder="Dis-lui quoi faire…" aria-label="Ce que tu dis, au porteur de la caméra ou pour décrire un monde">
    <button type="submit" id="envoi">Dire</button>
  </form>
  <div id="outils" class="outils" role="group" aria-label="Autres commandes" hidden>
    <button id="monde" type="button" class="ghost">Décrire un monde</button>
    <button id="mesurer" type="button" class="ghost">Mesurer</button>
    <button id="banc" type="button" class="ghost" title="Environ 15 s, caméra figée : ce que coûte chaque partie de l'image sur cet appareil">Banc d'essai</button>
    <button id="voix-inter" type="button" class="ghost" aria-pressed="false" title="Ses pensées lues à voix haute">Voix : non</button>
    <button id="sons-inter" type="button" class="ghost" aria-pressed="true" title="Bruitages (crédits des prises : docs/bruitages.md)">Sons : oui</button>
    <button id="suivi" type="button" class="ghost" aria-pressed="true" hidden>Suivi du téléphone : oui</button>
    <button id="qualite" type="button" class="ghost" aria-pressed="false" title="Mobile : téléphone moyen. Complète : ordinateur, pleine résolution.">Qualité : mobile</button>
    <button id="v2" type="button" class="ghost" aria-pressed="false" hidden title="Essai : tourner des panoramiques, puis les projeter">Moteur v2</button>
    <button id="v3" type="button" class="ghost" aria-pressed="false" title="Essai : semer des grains au lieu de lancer des rayons">Moteur v3</button>
    <button id="ombrage-raz" type="button" class="ghost" hidden title="Une version plus riche de l'image n'a pas pu se préparer sur cet appareil : la retenter (la page se recharge)">Image complète : réessayer</button>
    <small id="sons-credit" class="credit-sons"></small>
  </div>
  <div class="row commandes" id="commandes">
    <button id="parler" type="button">Lui parler</button>
    <button id="lieu" type="button" aria-controls="banque" aria-expanded="false">Scènes</button>
    <button id="plus" type="button" class="ghost" aria-controls="outils" aria-expanded="false">Plus</button>
  </div>
</div>
<div id="mesure" hidden>
  <pre id="mesure-txt"></pre>
  <div class="row"><button id="mesure-copier" type="button">Copier</button><button id="mesure-fermer" type="button" class="ghost">Fermer</button></div>
</div>
<div id="err"></div>
<!-- constructeur de monde : banque de scènes (src/atelier.js) -->
<button id="chantier-puce" class="chantier-puce" type="button" hidden></button>
<aside id="banque" class="banque" hidden aria-labelledby="banque-titre">
  <div class="banque-tete"><h2 id="banque-titre">Scènes</h2><span id="banque-mode" class="banque-mode"></span><button id="banque-fermer" type="button" class="ghost">Fermer</button></div>
  <p id="banque-alerte" class="banque-alerte" role="status" hidden></p>
  <form id="banque-nouvelle" class="banque-nouvelle">
    <label for="banque-desc">Nouvelle scène</label>
    <textarea id="banque-desc" rows="3" maxlength="4000" placeholder="Décris un lieu, en une ligne ou en dix : l'heure, la météo, ce qu'on doit voir…"></textarea>
    <div class="row gauche"><button type="submit" id="banque-creer">Créer la scène</button><button type="button" id="banque-dicter" class="ghost" aria-pressed="false" hidden>Dicter</button></div>
  </form>
  <section id="chantier" class="chantier" aria-live="polite" hidden></section>
  <ul id="banque-liste" class="banque-liste" aria-label="Scènes"></ul>
</aside>
<div id="fin" hidden>
  <p class="fin-sur">Fin</p>
  <h2 id="fin-titre"></h2>
  <p id="fin-texte"></p>
  <div class="row"><button id="fin-rejouer" type="button">Rejouer</button><button id="fin-quitter" type="button" class="ghost">Se promener</button></div>
</div>

<script>
__MAIN_JS__
</script>
</body>
</html>
