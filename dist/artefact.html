    float bound=length(p-o0.xyz)-o0.w;
    if(bound>.8){ d=min(d,bound); continue; }
    float od=1e5; float best=1e5; float brow=0.;
    int st=int(o1.x), cn=int(o1.y);
    for(int j=0;j<24;j++){
      if(j>=cn) break;
      int row=st+j;
      vec4 a=texelFetch(uShapes,ivec2(0,row),0), b=texelFetch(uShapes,ivec2(1,row),0), e=texelFetch(uShapes,ivec2(3,row),0);
      float dd=sdPrim(primLocal(p,row),a.w,b.xyz)-e.y;
      if(dd<best){ best=dd; brow=float(row); }
      od=e.x>0.?smin(od,dd,e.x):min(od,dd);
    }
    od*=.8;
    if(od<d){ d=od; info=vec4(0.,0.,0.,brow); }
  }
  return d;
}

/* ---- semis : la fiche décrit un élément (jusqu'à 6 formes), le moteur le répète sur une grille, un élément par cellule.
   Aucune famille d'objets n'est écrite ici : immeubles, réverbères, voitures, tombes sont des données.
   Couche k : lignes SEM0+10k à SEM0+10k+9 de uShapes.
   ligne 0 : (cellule x, cellule z, cos, sin de la rotation) (densité, groupes, fréquence des groupes, rangée le long du trajet)
             (écart au trajet min, max, côté -1/0/1, orientation 0 aléatoire 1 face au trajet 2 fixe) (cap, cap aléatoire, penche, teinte)
   ligne 1 : (jeu x, jeu z, échelle min, max) (hauteur min, max, nombre de formes, rangées) (centre de la boîte englobante, couleurs de palette)
             (demi-tailles de la boîte englobante, suit la pente)
   lignes 2 et 3 : palette, 8 couleurs.   lignes 4 à 9 : les formes, comme celles des objets, dans le repère de l'élément.
   Le lanceur de rayons n'appelle ce code que dans sa variante SEMIS ; le semeur (moteur v3) sème les mêmes éléments (semeS). */
const int SEM0=72, SEML=10;
uniform int   uSemN;       // nombre de couches de semis
uniform vec4  uSemTop;     // hauteur au-dessus du sol au-delà de laquelle une couche n'a plus rien
float gTol;                  // tolérance de la marche en cours : au loin, la marge des cellules s'élargit d'autant
vec4 gInst;                  // élément touché : cap, échelle, étirement, aléa (écrit par objId)
vec2 semMonde(vec2 g, float side, float t0, vec4 A, bool rg){   // repère de la grille -> monde
  return rg?vec2(pathX(g.y)+side*(g.x+t0),g.y):g*mat2(A.z,A.w,-A.w,A.z);
}
/* Un élément de semis : tout ce que la cellule tire (présence, décalage, cap, échelle, sol dessous). Calculé par les fonctions
   ci-dessous, en un seul endroit : sdSemis (lanceur de rayons, sonde, matière du semeur) et le semeur (v3_grains.vert)
   s'en servent, un élément semé tombe donc là où le lanceur de rayons le voit. */
struct ElemS { vec4 A, B, T, K, J, D, E, h2; vec2 gc, sl; vec3 th; float side, yaw, s, sy, sh; bool rg; };
vec2 semisG(vec2 xz, ElemS e){ return e.rg?vec2(e.side*(xz.x-pathX(xz.y))-e.T.x,xz.y):mat2(e.A.z,e.A.w,-e.A.w,e.A.z)*xz; }   // monde -> repère de la grille
// Cellule de la couche k sous le point xz du sol. Rend -1 si le point est dans la grille (id, f : cellule et position dans
// la cellule), sinon une borne de la distance horizontale à la grille (rive exclue, trop près ou trop loin du trajet).
void semisTete(int k, float side, out ElemS e){              // la couche k (et la rive, en rangée) : sa grille
  int r0=SEM0+k*SEML;
  e.A=texelFetch(uShapes,ivec2(0,r0),0); e.B=texelFetch(uShapes,ivec2(1,r0),0); e.T=texelFetch(uShapes,ivec2(2,r0),0);
  e.K=texelFetch(uShapes,ivec2(1,r0+1),0);
  e.rg=e.B.w>.5; e.side=e.rg?side:1.;
}
float semisGrille(vec2 xz, int k, out ElemS e, out vec2 id, out vec2 f){
  semisTete(k,1.,e); id=vec2(0.); f=vec2(0.);
  if(e.rg){                                                  // rangée : la grille suit le trajet, les deux rives en miroir
    float u=xz.x-pathX(xz.y); e.side=u<0.?-1.:1.;
    if(e.T.z*e.side<-.5) return abs(u)+e.T.x;                // rive exclue
    float gx=abs(u)-e.T.x;
    if(gx<0.) return -gx;
    float far=gx-e.K.w*e.A.x; if(far>0.) return far;
  }
  vec2 g=semisG(xz,e);
  id=floor(g/e.A.xy); f=g-(id+.5)*e.A.xy;
  return -1.;
}
// L'élément de la cellule id (après semisGrille) : false si la cellule est vide (densité, groupes, bande d'écart au trajet, objet dégagé).
bool semisElem(int k, vec2 id, inout ElemS e){
  int r0=SEM0+k*SEML;
  vec4 h=h42(id+uSeed.xy+vec2(13.7,71.3)*float(k+1)+(e.side<0.?vec2(41.3,7.9):vec2(0.)));
  float dens=e.B.x;
  if(e.B.y>0.) dens*=mix(1.,smoothstep(.3,.7,vnoise(id*e.B.z+uSeed.xy+float(k)*17.)),e.B.y);
  if(h.x>=dens) return false;
  e.J=texelFetch(uShapes,ivec2(0,r0+1),0); e.D=texelFetch(uShapes,ivec2(3,r0),0); e.E=texelFetch(uShapes,ivec2(3,r0+1),0);
  e.gc=(id+.5)*e.A.xy+(h.yz-.5)*2.*e.J.xy;
  vec2 w=semMonde(e.gc,e.side,e.T.x,e.A,e.rg);
  float dx=0.;
  if(!e.rg){ dx=w.x-pathX(w.y); if(abs(dx)<e.T.x || abs(dx)>e.T.y || dx*e.T.z<0.) return false; }
  if(cleared(w)) return false;
  e.h2=h42(id*1.37+h.yz*91.+float(k)*3.1+e.side);
  float yaw=e.D.x;                                           // cap dans le repère de la grille
  if(e.T.w<.5) yaw=e.h2.z*6.2832;
  else if(e.T.w<1.5){
    if(e.rg) yaw=-1.5708;
    else { float sg=dx<0.?-1.:1., z=w.y, sl=uTraj.x*(.1504*cos(z*.047+uSeed.z)+.1808*cos(z*.113+1.7+uSeed.z*2.)); yaw=atan(-sg,sg*sl)-atan(e.A.w,e.A.z); }
  }
  e.yaw=yaw+(e.h2.w-.5)*e.D.y;
  vec3 th=vec3(0.);
  for(int i=0;i<3;i++){                                      // sol sous l'élément ; s'il suit la pente, deux points de plus (un seul terrainH déplié)
    th[i]=terrainH(i==0?w:semMonde(e.gc+(i==1?vec2(1.,0.):vec2(0.,1.)),e.side,e.T.x,e.A,e.rg));
    if(e.E.w<.5) break;
  }
  e.th=th; e.sl=e.E.w>.5?th.yz-th.x:vec2(0.); e.sh=inversesqrt(1.+dot(e.sl,e.sl));
  e.s=mix(e.J.z,e.J.w,e.h2.x); e.sy=mix(e.K.x,e.K.y,e.h2.y);
  return true;
}
vec3 semisLocal(vec3 p, ElemS e){                            // monde -> repère de l'élément (mètres de la fiche, avant échelle)
  vec2 d=semisG(p.xz,e)-e.gc;
  vec3 lp=vec3(d.x,p.y-e.th.x,d.y);
  lp.y-=dot(e.sl,lp.xz);                                     // suit la pente : cisaillé selon le sol sous l'élément
  float c=cos(e.yaw), sn=sin(e.yaw); lp.xz=vec2(c*lp.x-sn*lp.z,sn*lp.x+c*lp.z);
  if(e.rg && e.side<0.) lp.x=-lp.x;                          // l'autre rive : on défait le miroir
  if(e.D.z>0.){ vec2 pa=(fract(e.h2.zw*17.31)-.5)*2.*e.D.z; float c1=cos(pa.x), s1=sin(pa.x), c2=cos(pa.y), s2=sin(pa.y);
    lp.xy=vec2(c1*lp.x+s1*lp.y,-s1*lp.x+c1*lp.y); lp.zy=vec2(c2*lp.z+s2*lp.y,-s2*lp.z+c2*lp.y); }
  lp/=e.s; lp.y/=e.sy;
  return lp;
}
vec3 semisMonde(vec3 lp, ElemS e){                           // l'inverse : repère de l'élément -> monde
  lp.y*=e.sy; lp*=e.s;
  if(e.D.z>0.){ vec2 pa=(fract(e.h2.zw*17.31)-.5)*2.*e.D.z; float c1=cos(pa.x), s1=sin(pa.x), c2=cos(pa.y), s2=sin(pa.y);
    lp.zy=vec2(c2*lp.z-s2*lp.y,s2*lp.z+c2*lp.y); lp.xy=vec2(c1*lp.x-s1*lp.y,s1*lp.x+c1*lp.y); }
  if(e.rg && e.side<0.) lp.x=-lp.x;
  float c=cos(e.yaw), sn=sin(e.yaw); lp.xz=vec2(c*lp.x+sn*lp.z,-sn*lp.x+c*lp.z);
  lp.y+=dot(e.sl,lp.xz);
  vec2 w=semMonde(e.gc+lp.xz,e.side,e.T.x,e.A,e.rg);
  return vec3(w.x,lp.y+e.th.x,w.y);
}
float sdSemis(vec3 p, int k, out vec4 info, out vec4 inst){
  int r0=SEM0+k*SEML;
  info=vec4(0.); inst=vec4(0.);
  float marge=max(.08,1.5*gTol)+(uMode==1?50.:0.);          // jamais sous la tolérance de la marche : pas de faux impact sur une limite de cellule
  ElemS e; vec2 id, f;
  float bg=semisGrille(p.xz,k,e,id,f);
  if(bg>=0.) return bg+marge;
  float dOut=min(.5*e.A.x-abs(f.x),.5*e.A.y-abs(f.y))+marge;
  if(!semisElem(k,id,e)) return dOut;
  vec3 lp=semisLocal(p,e);
  float sc=e.s*min(1.,e.sy)*e.sh;
  vec4 bc=texelFetch(uShapes,ivec2(2,r0+1),0);
  float bb=sdBox(lp-bc.xyz,e.E.xyz);                         // boîte englobante : on ne détaille que de près
  if(bb>.3) return min(bb*sc*.9,dOut);
  float od=1e5, best=1e5, brow=0.; int cn=int(e.K.z);
  for(int j=0;j<cn;j++){
    int row=r0+4+j;
    vec4 a=texelFetch(uShapes,ivec2(0,row),0), b=texelFetch(uShapes,ivec2(1,row),0), ee=texelFetch(uShapes,ivec2(3,row),0);
    float dd=sdPrim(primLocal(lp,row),a.w,b.xyz)-ee.y;
    if(dd<best){ best=dd; brow=float(row); }
    od=ee.x>0.?smin(od,dd,ee.x):min(od,dd);
  }
  info=vec4(lp,brow+.9*e.h2.w);
  inst=vec4(e.yaw,e.s,e.sy,e.h2.w);
  return min(od*sc*.85,dOut);
}
vec3 formeCol(int row, float hv){                            // couleur d'une forme ; "palette" : une couleur par élément
  vec4 cm=texelFetch(uShapes,ivec2(2,row),0);
  if(cm.r>=0.) return cm.rgb;
  int r0=SEM0+((row-SEM0)/SEML)*SEML;
  float np=texelFetch(uShapes,ivec2(2,r0+1),0).w;
  int i=int(min(floor(fract(hv*7.13)*np),np-1.));
  return texelFetch(uShapes,ivec2(i&3,r0+2+(i>>2)),0).rgb;
}

/* ---- distance au décor : tout ce qui est solide (sol, arbres, perches, blocs, semis, objets). Lue par le lanceur de rayons
   à chaque pas, et par la sonde de collision (v3_sonde.frag, compilée avec SEMIS). */
uniform vec2  uTerK;       // pas de marche sur le relief : partout, et près d'un bord de trajet raide (0 = inutile)
float map(vec3 p){
  float th=terrainH(p.xz);
  float y=p.y-th;
  float d=y*(uTerK.y>0. && abs(gAx-.5*(uCreux.y+uCreux.z))<abs(uCreux.y-uCreux.z)*.5+.3?uTerK.y:uTerK.x);   // pas réduit près d'un bord de trajet raide
  vec4 nf;
#if !NU
  if(uKit==0){
    if(y<19.) d=min(d,sdTreeA(p,th,nf)); else d=min(d,y-17.8);
    if(y<12.) d=min(d,sdTreeB(p,th,nf)); else d=min(d,y-11.3);
  }
  if(uKitP.y>0.){ if(y<4.5) d=min(d,sdRock(p,th,nf)); else d=min(d,y-3.9); }
#endif
#if SEMIS
  for(int k=0;k<uSemN;k++){                                  // une seule évaluation de semis, dans une boucle : le compilateur n'en déplie qu'une.
    float tp=uSemTop[k];                                     // En rendu logiciel, ce code coûte même quand il ne s'exécute pas : d'où la variante SEMIS.
    if(y<tp+1.){ vec4 si; d=min(d,sdSemis(p,k,nf,si)); } else d=min(d,y-tp);   // au-dessus de la couche : borne simple, jamais nulle
  }
#endif
  if(uObjN>0) d=min(d,sdProps(p,nf));
  return d;
}

/* ---- canopée : densité, transmittance, feuilles et branches discrètes */
float coneDens(vec3 c){                                      // conifères : un cône de feuillage par arbre, étagé, du pied à la cime
  vec2 q=RA*c.xz; vec2 id=floor(q/CA); vec2 f=q-(id+.5)*CA;
  vec4 h=h42(id+uSeed.xy);
  if(h.x>uKitP.x) return 0.;
  vec2 o=(h.yz-.5)*3.8;
  vec2 w=((id+.5)*CA+o)*RA;
  if(abs(w.x-pathX(w.y))<1.5) return 0.;
  float y=c.y-terrainH(w), H=11.+6.*h.w;
  float t=(y-uHoup.y)/(H+1.2-uHoup.y);
  if(t<0. || t>1.) return 0.;
  float R=min(uHoup.z*(.8+.4*h.w),3.3-max(abs(o.x),abs(o.y)))*(1.-.92*t)*(.8+.2*sin(y*4.2+h.w*30.));   // l'arbre reste dans sa cellule
  float r=length(f-o);
  float trou=vnoise3(c*vec3(1.7,2.6,1.7)+h.w*9.);
  return smoothstep(R,R*.7,r)*smoothstep(.12,.4,trou)*4.*uKitP.z;
}
float canopyDens(vec3 c){
  if(uHoup.x>.5) return coneDens(c);
  float hp=smoothstep(YC0,YC0+2.5,c.y)*smoothstep(YC1,YC1-4.,c.y);
  if(hp<=0.) return 0.;
  float n=vnoise3(c*vec3(.21,.26,.21)+uSeed)*.7+.3*vnoise3(c*.63+7.);
  float gap=mix(.72,1.,smoothstep(.5,5.,abs(c.x-pathX(c.z))));
  return smoothstep(.50,.63,n)*hp*gap*uKitP.z;
}
float canopyT(vec3 ro, vec3 rd){
#if NU
  return 1.;
#endif
  if(uKitP.z<=0. || uKit!=0) return 1.;
  float ry=abs(rd.y)<1e-4?1e-4:rd.y;
  float ta=(YC0-ro.y)/ry, tb=(YC1-ro.y)/ry;
  float t0=max(min(ta,tb),0.), t1=max(ta,tb);
  if(t1<=t0) return 1.;
  t1=min(t1,t0+60.);
  float ds=(t1-t0)/6.; float od=0.; float j=rnd();
  for(int i=0;i<6;i++) od+=canopyDens(ro+rd*(t0+(float(i)+j)*ds));
  return exp(-od*ds*SIG);
}
vec3 leafCol(vec3 c, float h){
  if(uHoup.x>.5) return mix(vec3(.010,.030,.014),vec3(.034,.075,.030),h)*(.7+.6*vnoise3(c*.4+uSeed));   // aiguilles : vert sombre toute l'année
  float sp=vnoise3(c*.09+uSeed+40.);
  if(sp<.42) return mix(vec3(.030,.062,.018),vec3(.055,.095,.028),h);
  vec3 ete=mix(vec3(.035,.085,.018),vec3(.075,.15,.03),h);
  vec3 aut=sp<.70?mix(vec3(.30,.15,.035),vec3(.46,.30,.06),h):mix(vec3(.50,.36,.05),vec3(.36,.38,.07),h);
  return mix(ete,aut,uKitP.w);
}
void matCone(vec3 p, vec3 gn, out vec3 alb, out vec3 n, out float spec){   // cœur de feuillage d'un conifère, vu de près (lanceur de rayons et semeur)
  alb=leafCol(p,vnoise3(p*5.))*(.5+.6*vnoise3(p*vec3(8.,13.,8.))); spec=.02;
  n=normalize(gn+(vec3(vnoise3(p*17.),vnoise3(p*17.+7.),vnoise3(p*17.+13.))-.5)*.9);
}

/* ---- ciel et brume */
vec3 skyBase(vec3 rd){
  float y=max(rd.y,0.);
  vec3 c=mix(vec3(.62,.72,.86),vec3(.16,.34,.78),pow(y,.45))*2.2*uSky;
  float s=max(dot(rd,uSunDir),0.);
  c+=uSun*vec3(.143,.129,.109)*(.9*pow(s,6.)+3.*pow(s,48.));
  return c;
}
vec3 skyCol(vec3 rd){
  float s=max(dot(rd,uSunDir),0.);
  return skyBase(rd)+uSun*vec3(6.4,7.2,8.7)*smoothstep(.9996,.99985,s);
}
/* ---- lointain : la ligne d'horizon (montagnes, collines), calculée par direction et non tracée.
   Deux plans : un massif au fond, des contreforts devant. Neige au-dessus d'une altitude, lumière du soleil, voile de l'air. */
uniform vec4 uLoin;          // hauteur du massif (tangente de l'angle), découpe des crêtes, altitude de la neige (0 à 1, au-delà : aucune), présence
uniform vec3 uLoinCol;       // roche
uniform vec3 uLoinBas;       // contreforts
float loinCrete(float az, float k){                         // profil des crêtes autour de l'horizon, sans couture
  vec2 c=vec2(cos(az),sin(az))*uLoin.y; float s=0., a=.55, f=1.;
  for(int i=0;i<5;i++){ float n=vnoise(c*f+uSeed.xy*3.+k*17.+float(i)*5.3); s+=a*(i<1?n:1.-abs(2.*n-1.)); a*=.42; f*=2.; }
  return s;
}
vec3 lointain(vec3 rd, vec3 c){
  float az=atan(rd.x,rd.z), el=rd.y/max(length(rd.xz),1e-4);
  if(el>uLoin.x*1.25) return c;
  vec3 air=skyBase(normalize(vec3(rd.x,.02,rd.z)));
  float sa=atan(uSunDir.x,uSunDir.z);
  for(int k=0;k<2;k++){
    float fk=float(k), H=uLoin.x*(k==0?1.:.34);
    float cr=H*(.42+1.15*loinCrete(az,fk));
    float d=(loinCrete(az+.03,fk)-loinCrete(az-.03,fk))*14.;                       // pente de la crête : versant au soleil ou à l'ombre
    float lit=clamp(.45+.9*d*sin(sa-az)+.35*cos(sa-az),.03,1.);
    float alt=el/max(uLoin.x,1e-4);
    float plis=.6*vnoise(vec2(az*uLoin.y*9.+alt*7.+fk*9.,alt*9.-az*5.))+.4*vnoise(vec2(az*uLoin.y*30.-alt*16.,alt*26.+fk*3.));                            // couloirs et arêtes dans la face
    vec3 alb=k==0?uLoinCol*(.7+.6*plis):uLoinBas*(.75+.5*plis);
    if(k==0) alb=mix(alb,vec3(.86,.88,.92),smoothstep(uLoin.z-.05,uLoin.z+.05,alt+.5*(plis-.5)+.25*(cr/H-.7)));   // la neige tient sur les hauts, la roche perce dans les faces
    vec3 col=alb*(uSun*lit*(.30+.15*plis)+vec3(.42,.52,.72)*uSky*.42);
    col=mix(col,air,(k==0?.30:.14)*(1.-.5*smoothstep(0.,.8,alt)));   // le voile de l'air s'accroche au pied, les sommets en sortent
    c=mix(c,col,smoothstep(cr+.004,cr-.004,el));
  }
  return c;
}
vec3 fogCol(vec3 rd){ float s=max(dot(rd,uSunDir),0.); return mix(vec3(.27,.31,.34)*uSky,uSun*vec3(.171,.164,.156),pow(s,5.)*.8); }
uniform vec4 uEau;           // eau à l'horizon (mer, baie, lac) sous les rayons qui ne touchent rien : couleur, présence
vec3 eauLoin(vec3 rd){
  vec2 w=rd.xz/max(-rd.y,.004);                              // vagues : la normale bouge, plus serrée vers l'horizon
  vec3 n=normalize(vec3((vnoise(w*.9+uSeed.xy)-.5)*.12,1.,(vnoise(w*.9+uSeed.xy+7.)-.5)*.12));
  vec3 rr=reflect(rd,n); rr.y=abs(rr.y);
  float fr=.02+.98*pow(1.-max(dot(-rd,n),0.),5.);
  vec3 c=mix(uEau.rgb*(uSun*.05+uSky*.35),min(skyCol(rr),vec3(40.)),fr);
  return mix(c,fogCol(rd),.25*smoothstep(-.08,0.,rd.y));
}

/* ---- éclairage */
vec3 sunSample(){ float a=6.2832*rnd(), r=sqrt(rnd())*.011; vec3 t=normalize(cross(uSunDir,vec3(0.,1.,0.))), b=cross(uSunDir,t);
  return normalize(uSunDir+(t*cos(a)+b*sin(a))*r); }
vec3 cosDir(vec3 n){ float a=6.2832*rnd(), u=rnd()*2.-1.; float s=sqrt(max(1.-u*u,0.)); return normalize(n+vec3(s*cos(a),s*sin(a),u)*.999); }

#define CANOPY_GLOW (vec3(.50,.36,.12)*(dot(uSun,vec3(.06))+.2*uSky.g))

vec3 shadeLeaf(vec3 p, vec3 n, vec3 alb, vec3 rd){
  if(dot(n,rd)>0.) n=-n;
  vec3 sd=sunSample();
  float T=canopyT(p+sd*.3,sd);
  float ndl=dot(n,sd);
  vec3 col=SUN*T*(ndl>0.?alb*ndl:alb*vec3(1.25,1.15,.6)*(-ndl)*.55);
  vec3 h=normalize(sd-rd);
  col+=SUN*T*max(ndl,0.)*.3*pow(max(dot(n,h),0.),40.);
  float hg=clamp((p.y-YC0)/(YC1-YC0),0.,1.);
  vec3 ambUp=vec3(.45,.55,.70)*mix(.25,1.3,hg*hg)*uSky;
  vec3 ambDn=vec3(.13,.11,.07)*uSky;
  if(uTorch>0.){

function validerRecettes(m){                                    // la fiche ne garde que des recettes de taille raisonnable

const sstep=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };

const pathYaw=z=>Math.atan2(pathX(z+3)-pathX(z-3),6);
function ondul(x,z){ const qx=x*S.rel[1], qz=z*S.rel[1];
  return S.rel[0]*(1.5*Math.sin(qx*.041+.6+seed[2])*Math.cos(qz*.035+1.1)+.65*Math.sin(qx*.097+qz*.071+2)+.22*Math.sin(qx*.29-qz*.21+seed[2]*3)); }

    return 3.2*(1-Math.abs(Math.sin(a)))*(.62+.38*Math.sin(z*.03+2+seed[2]))+.5*Math.sin(x*.11+z*.08); }

  let h=ondul(S.rel[3]>0?x+(px-x)*sstep(S.rel[3]+5,S.rel[3],ax):x,z);   // une rue reste de niveau en travers : l'ondulation y est lue sur l'axe

const pb=new Float32Array(16), pb8=new Uint8Array(16);
/* Lecture différée d'une cible (sonde, exposition) : readPixels dans un tampon de la puce (PBO), puis une barrière (fenceSync).

function lectureDiff(){ return {buf:null,sync:null,taille:0,t:0}; }
function lireDiff(L,cible,w,h,n){                              // lance la lecture de w × h pixels RGBA flottants de la cible

/* Le téléphone comme caméra : on l'oriente comme pour filmer, le regard suit. Le déplacement reste celui du porteur.

function surOrientation(e){

const clampN=(v,a,b,d)=>{ v=Number(v); return Number.isFinite(v)?Math.min(b,Math.max(a,v)):d; };

function lexique(t){                                          // secours sans IA : quelques ordres simples
  t=t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const num=(t.match(/(\d+)/)||[])[1], out={pensee:"",actions:[],scene:null};
  if(/stop|arrete|attends/.test(t)){ queue.length=0; out.pensee="Je m'arrête."; return out; }
  if(/demi.?tour|retourne/.test(t)){ out.actions.push({type:"tourner",degres:180}); out.pensee="Demi-tour."; }
  else if(/gauche/.test(t)){ out.actions.push({type:"tourner",degres:-(num||(/(un peu|leger)/.test(t)?30:90))}); out.pensee="À gauche, d'accord."; }
  else if(/droite/.test(t)){ out.actions.push({type:"tourner",degres:+(num||(/(un peu|leger)/.test(t)?30:90))}); out.pensee="À droite, d'accord."; }
  if(/recule/.test(t)){ out.actions.push({type:"marcher",metres:-(num||4)}); out.pensee=out.pensee||"Je recule."; }
  else if(/avance|marche|continue|tout droit|\bva\b|vas-y/.test(t)){ out.actions.push({type:"marcher",metres:+(num&&!/gauche|droite/.test(t)?num:8)}); out.pensee=out.pensee||"J'avance."; }
  if(/en haut|ciel|leve/.test(t)){ out.actions.push({type:"regarder",degres:50}); out.pensee=out.pensee||"Je lève la caméra."; }
  else if(/en bas|sol|pieds|baisse/.test(t)){ out.actions.push({type:"regarder",degres:-40}); out.pensee=out.pensee||"Je regarde par terre."; }
  else if(/devant|horizon/.test(t)){ out.actions.push({type:"regarder",degres:-2}); }

  else if(/jour|matin|soleil/.test(t)) out.scene=Object.assign(out.scene||{},{soleil:{azimut:-33,hauteur:21},lampe:false});

}

${fiche.histoire?`L'histoire que tu vis sans la connaître d'avance (ne la récite pas, laisse-la arriver) : ${JSON.stringify(fiche.histoire)}

`:""}Ce que tu perçois : ${JSON.stringify(perception())}

    try{ rep=await sampler.json(consigne,{modelTier:"quick",cache:false}); }

/* Banc des passes : que coûte, sur cette puce, une passe de rendu presque vide, selon le format et la taille de la cible ?

   c'est le nombre de passes par image qu'il faut réduire. Dix (ou cent) passes en ping-pong, une seule attente à la fin. */
function bancPasses(){
  const L=[], fx=v=>v.toFixed(2).replace(".",","), f32=new Float32Array(4), u8=new Uint8Array(4);
  const lire=(t,flo)=>{ gl.bindFramebuffer(gl.FRAMEBUFFER,t.f); if(flo) gl.readPixels(0,0,1,1,gl.RGBA,gl.FLOAT,f32); else gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,u8); };
  const essai=(nom,fmt,flo,w,h,N)=>{
    const a=target(w,h,fmt,gl.NEAREST), b=target(w,h,fmt,gl.NEAREST); if(!a.ok||!b.ok){ freeT(a); freeT(b); L.push(nom.padEnd(30)+"cible refusée"); return; }
    gl.useProgram(P_DOWN.p); gl.uniform2f(P_DOWN.u.uDstRes,w,h); gl.disable(gl.DEPTH_TEST); gl.disable(gl.SCISSOR_TEST);

    const m=[]; for(let k=0;k<5;k++){ lire(a,flo); const t0=performance.now(); const fin=tour(N); lire(fin,flo); m.push((performance.now()-t0)/N); }
    m.sort((x,y)=>x-y); L.push(nom.padEnd(30)+fx(m[2])+" ms par passe ("+N+" passes)");
    freeT(a); freeT(b);
  };

  essai("RGBA16F, 128 × 128",gl.RGBA16F,true,128,128,10);
  essai("RGBA32F, 128 × 128",gl.RGBA32F,true,128,128,10);
  essai("RGBA8, taille de l'image",gl.RGBA8,false,W,H,10);
  essai("RGBA16F, taille de l'image",gl.RGBA16F,true,W,H,10);
  essai("RGBA32F, taille de l'image",gl.RGBA32F,true,W,H,10);
  essai("RGBA8, 128 × 128, à la chaîne",gl.RGBA8,false,128,128,100);
  essai("RGBA16F, 128 × 128, à la chaîne",gl.RGBA16F,true,128,128,100);

/* Objets du meneur (accessoiriste, suites) : ajoutés à la fiche en cours, bornés par validerFiche, rangés par buildShapes

  const q=posObjet(o), dx=q.x-cam.x, dz=q.z-cam.z, m=Math.max(.3,Math.hypot(dx,dz));
  const haut=Math.max(.1,...(o.formes||[]).map(f=>Array.isArray(f.p)?f.p[1]*clampN(o.echelle,.1,5,1):0))*.6;   // vers le milieu de l'objet
  let yaw=Math.atan2(dx,dz)-cam.yaw; yaw=Math.atan2(Math.sin(yaw),Math.cos(yaw));
  const dy=terrainH(q.x,q.z)+haut-(terrainH(cam.x,cam.z)+S.eye*cam.haut);
  return {yaw,pitch:Math.max(-1.05,Math.min(1.3,Math.atan2(dy,m)))};
}
/* Une forme « vacille » : son éclat tremble. On ne touche qu'aux couleurs dans la texture d'objets, sans relancer
   l'accumulation (sceneDirty) : l'image reste nette, la reprojection lisse le tremblement. Le vrai effet (lumière portée qui
   danse) demande une lumière ponctuelle dans le moteur : voir docs/meneur-de-jeu.md §13. */
setInterval(()=>{ if(!S.vac||!S.vac.length||document.hidden) return; const t=performance.now()/1000;
  for(const [r,c0,c1,c2,a,ph] of S.vac){ const k=Math.max(.2,1+a*(.32*Math.sin(t*8.3+ph)+.22*Math.sin(t*21.7+ph*2.3)+.3*(Math.random()-.5)));
    shapesData[r+8]=c0*k; shapesData[r+9]=c1*Math.pow(k,1.3); shapesData[r+10]=c2*Math.pow(k,1.6); }
  gl.bindTexture(gl.TEXTURE_2D,shapesT); gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,4,SH_ROWS,gl.RGBA,gl.FLOAT,shapesData); },100);
function ticMeneur(){
  if(!meneur) return;
  const now=performance.now(), dt=Math.min(5,(now-meneurT)/1000); meneurT=now;
  meneur.tic(dt,percevoirMeneur(),{gel:frozen});
  if(dbgOn) dbgEl.textContent=meneur.debug();
  if(meneur.fini()) clearInterval(meneurTimer);
}
function meneurEntendre(texte){ say("…");
  if(meneurLibre){                                             // promenade libre : une fois qu'on lui a parlé, il ne repart plus tout seul
    const t=texte.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    errance=/promene|balade-toi|balade toi|continue ta|reprends ta|comme tu veux|ou tu veux|fais ta vie/.test(t);
    if(/stop|arrete|bouge plus|ne bouge|attends|reste la|halte/.test(t)) queue.length=0;
  }
  return meneur.voix(texte); }
function interfaceHistoire(on){
  for(const id of ["monde","lieu","mesurer","histoire","v3"]) if($(id)) $(id).hidden=on;
  if($("journal")) $("journal").hidden=!on&&!dernierJournal;
  $("hint").textContent=on?"Glisse pour regarder · « Lui parler » pour lui dire quelque chose":"Glisse pour regarder autour de lui";
  $("hint").classList.remove("off"); $("parler").classList.remove("pulse"); $("fin").hidden=true;
}
/* Promenade libre : pas d'histoire écrite, mais le même meneur. Le personnage y fait ce qu'on lui demande, ce qu'il fait
   apparaît et peut avoir des suites, comme dans une histoire ; simplement, rien n'est prévu d'avance et rien ne finit.
   Le contrat est fabriqué à la volée à partir du lieu courant, au premier mot du joueur. */
function histoireLibre(f){
  const nObj=(Array.isArray(f.objets)?f.objets:[]).length;
  return { version:1, id:"libre", titre:String(f.titre||"Promenade").slice(0,80),
    pitch:"Une promenade sans but dans ce lieu. Rien n'est écrit d'avance : ce que la voix propose arrive, avec ses conséquences.",
    ton:"naturel, concret, une pointe d'humour ; le personnage commente ce qu'il fait", duree_minutes:600,
    porteur:{ id:"sam", nom:"Sam", trait:"curieux, bon public, un peu râleur ; fait ce que la voix lui souffle et le commente à mi-voix", veut:"se promener et voir ce qui se passe",
      craint:[], refuse:[], sait:["ce lieu : "+String(f.inspiration||f.titre||"").slice(0,160)], ignore:[], depart:{peur:0,confiance:3,agacement:0}, relances:[] },
    voix:{ nature:"une intuition qu'il suit sans se poser de questions", gagne_la_confiance:[], perd_la_confiance:[] },
    monde:{ epoque:"De nos jours, monde ordinaire. Lieu : "+String(f.titre||"").slice(0,80)+".",
      existe:["tout ce qu'on voit ici", "ce qu'une personne a d'ordinaire sur elle : téléphone, briquet, clés, mouchoirs, un peu de monnaie", "ce qu'on peut ramasser ou fabriquer sur place de ses mains"],
      n_existe_pas:["magie, pouvoirs, créatures", "tout ce qui n'est pas d'aujourd'hui"],
      possible:["tout ce qu'une personne ordinaire peut faire de son corps et de ses mains, même absurde, trivial ou grossier"],
      impossible:["voler, se téléporter, faire apparaître quelque chose sans le fabriquer ou l'apporter"],
      hors_jeu:"Sam prend ça pour une idée bizarre qui lui traverse la tête : il hausse les épaules et continue. Il ne parle jamais de jeu ni de règles." },
    secrets:[], jamais:[], lieux:[{id:"lieu",role:"unique",fiche:f}], accessoires:[], temps:[], fins:[],
    improvisation:{ ambiance:{brume:[0,.05]}, objets_nouveaux:Math.max(0,8-nObj), permis:["tout ce que le geste demandé produit"], interdit:[] },
    consequences:{ peut_degenerer:["tout geste peut avoir les suites qu'il aurait dans la réalité (un feu prend, un tas s'écroule, la pluie éteint)"], jusqu_ou:"quelques mètres autour du geste", exclu:["blessures montrées"], ambiance:{brume:[0,.05]}, duree_max_s:180, fins:[] },
    limites:{ duree_minutes:600, interdits:[] },
    reglages:{ FIN_A_L_HEURE:false, RELANCES_MAX:0 } };
}
function demarrerLibre(){
  const h=histoireLibre(fiche), v=MENEUR.validerHistoire(h,{fiches:FICHES});
  if(!v.ok){ console.warn("Promenade libre : contrat refusé",v.erreurs); return false; }
  meneur=MENEUR.creerMeneur({ histoire:h, reglages:docile?{DOCILE:true}:undefined, graine:CFG.graine||((Date.now()%1e9)+1), secours:t=>{ const r=lexique(t); r.compris=!/pas compris/.test(r.pensee); return r; },
    demander:(c,opt)=>sampler?sampler.json(c,opt).catch(e=>{ if(e&&e.code==="not_granted") sampler=null; throw e; }):Promise.reject(new Error("sans Claude")),
    emettre:executer });
  meneurLibre=true; histoireId="libre"; meneurT=performance.now(); clearInterval(meneurTimer); meneurTimer=setInterval(ticMeneur,500); ticMeneur();
  if($("journal")) $("journal").hidden=false;
  return true;
}
function quitterLibre(){ if(meneurLibre&&meneur){ journal(); meneur=null; clearInterval(meneurTimer); } meneurLibre=false; }
/* Mode essai (« debug ») : un interrupteur toujours visible. Activé, le personnage fait exactement ce qu'on demande, la caméra
   se tourne vers ce qu'il vient de faire, et la ligne de mise au point s'affiche. Il prend effet à la prochaine phrase en
   promenade libre, à la prochaine partie pour une histoire en cours. */
{ const b=document.createElement("button"); b.type="button"; b.id="docile"; b.className="ghost";
  const maj=()=>{ b.textContent="Debug : "+(docile?"oui":"non"); b.setAttribute("aria-pressed",String(docile)); };
  b.onclick=()=>{ docile=!docile; try{ localStorage.setItem("bodycam-docile",docile?"1":"0"); }catch(_){} maj();
    if(meneurLibre) quitterLibre();
    else if(meneur) say(docile?"Mode debug : il prendra effet à la prochaine partie (Rejouer).":"Mode debug coupé à la prochaine partie.",true);
    dbgOn=docile; dbgEl.hidden=!dbgOn; if(!dbgOn) dbgEl.textContent=""; };
  $("outils").appendChild(b); maj(); setTimeout(()=>{ if(docile){ dbgOn=true; dbgEl.hidden=false; } },0); }
function jouerHistoire(id){
  const h=HIST.find(x=>x.id===id)||(id===undefined||id===true?HIST.find(x=>MENEUR.ficheDe(x)):null);
  if(!h){ console.warn("Histoire inconnue :",id,"— disponibles :",HIST.map(x=>x.id)); return null; }
  const v=MENEUR.validerHistoire(h,{fiches:FICHES});
  if(!v.ok){ console.warn("Histoire invalide :",v.erreurs); return null; }
  quitterLibre(); quitterHistoire(true);
  applyFiche(MENEUR.ficheDe(h,FICHES)||fiche);
  meneur=MENEUR.creerMeneur({ histoire:h, reglages:docile?{DOCILE:true}:undefined, graine:CFG.graine||((Date.now()%1e9)+1), secours:t=>{ const r=lexique(t); r.compris=!/pas compris/.test(r.pensee); return r; },
    demander:(c,opt)=>sampler?sampler.json(c,opt).catch(e=>{ if(e&&e.code==="not_granted") sampler=null; throw e; }):Promise.reject(new Error("sans Claude")),
    emettre:executer });
  histoireId=h.id; hold=false; patience=10; cam.haut=1; setFrozen(false); interfaceHistoire(true);
  meneurT=performance.now(); clearInterval(meneurTimer); meneurTimer=setInterval(ticMeneur,500); ticMeneur();
  return meneur.partie();
}
function quitterHistoire(garderLieu){
  if(!meneur) return; journal(); meneur=null; clearInterval(meneurTimer); hold=false; cam.haut=1; interfaceHistoire(false); dbgEl.textContent="";
  if(!garderLieu) applyFiche(FICHES[ficheIdx]);
}
/* Pour l'auteur : une ligne discrète avec le verdict du sas et le temps en cours. CFG.debug, ou trois touches rapides
   sur le chrono REC (réglage gardé dans le navigateur) : utile dans l'artefact sur téléphone, sans console. */
let dbgOn=!!CFG.debug; try{ if(localStorage.getItem("bodycam-debug")==="1") dbgOn=true; }catch(_){}
const dbgEl=document.body.appendChild(document.createElement("div")); dbgEl.id="debug-meneur"; dbgEl.setAttribute("aria-hidden","true"); dbgEl.hidden=!dbgOn;
{ const chip=document.querySelector(".hud.top .chip"); let n=0,t=0; chip.style.pointerEvents="auto";
  chip.addEventListener("pointerdown",()=>{ const now=performance.now(); n=now-t<450?n+1:1; t=now; if(n<3) return; n=0;
    dbgOn=!dbgOn; dbgEl.hidden=!dbgOn; dbgEl.textContent=meneur&&dbgOn?meneur.debug():""; try{ localStorage.setItem("bodycam-debug",dbgOn?"1":"0"); }catch(_){} }); }
if(HIST.some(x=>MENEUR.ficheDe(x))){ const b=document.createElement("button"); b.type="button"; b.id="histoire"; b.textContent="Jouer l'histoire";
  $("outils").prepend(b); b.onclick=()=>{ fermerOutils(); jouerHistoire(); }; }
/* Journal de partie : ce que le joueur peut copier et envoyer. Chaque tour : ce qu'il a dit, le verdict du sas,
   la pensée, les actions, le délai de Claude ou le secours ; plus les temps et la fin. Lisible sans outil. */
let dernierJournal="";
function journal(){
  if(!meneur) return dernierJournal;
  const t=meneur.trace(), L=[], f=v=>Number(v).toFixed(1).replace(".",",");
  const dbg=gl.getExtension("WEBGL_debug_renderer_info");
  L.push("JOURNAL · "+t.histoire+" · graine "+t.graine+" · "+(sampler?"avec Claude":"SANS Claude (secours)")+" · "+(dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):"")+" · "+new Date().toISOString().slice(0,16));
  const items=[];
  for(const a of t.appels||[]){
    const dit=(String(a.consigne||"").match(/La voix dit : (".*")\s*$/)||[])[1], r=a.reponse;
    let l="["+f(a.min)+" min] "+a.type.toUpperCase()+(dit?" · joueur : "+dit:"")+" · "+a.statut+(a.ms?" en "+f(a.ms/1000)+" s":"");
    if(r&&typeof r==="object"){
      if(r.sas) l+="\n    sas : "+[r.sas.verdict,r.sas.regle,r.sas.motif].filter(Boolean).join(" · ");
      l+="\n    "+(r.attitude?"("+r.attitude+") ":"")+"« "+String(r.pensee||"").slice(0,400)+" »";
      const ac=(r.actions||[]).map(x=>x.type+" "+(x.degres??x.metres??x.secondes??"")).join(", "); if(ac) l+="\n    actions : "+ac;
      if(r.objet&&typeof r.objet==="object") l+="\n    objet : "+String(r.objet.nom||"")+" ("+((r.objet.formes||[]).length)+" formes)";
      if(r.suite&&typeof r.suite==="object") l+="\n    suite : "+((r.suite.etapes||[]).length)+" étapes";
      for(const k of ["temps","fin","scene","faits","question","resume","fabrique","defaire"].concat(typeof r.suite==="string"?["suite"]:[])) if(r[k]!==undefined&&r[k]!==null&&r[k]!=="") l+="\n    "+k+" : "+(typeof r[k]==="string"?r[k]:JSON.stringify(r[k])).slice(0,300);
    }
    items.push({min:a.min,o:0,l});
  }
  for(const e of t.evenements||[]){
    if(e.type==="pensee"&&e.source==="ia") continue;                    // déjà dans l'appel
    const x=Object.assign({},e); delete x.min; delete x.type;
    items.push({min:e.min,o:1,l:"["+f(e.min)+" min] "+e.type+" · "+(e.type==="pensee"?e.source+" · « "+e.texte+" »":Object.entries(x).map(([k,v])=>k+" "+(typeof v==="string"?v:JSON.stringify(v))).join(" · "))});
  }
  items.sort((a,b)=>a.min-b.min||a.o-b.o).forEach(i=>L.push(i.l));
  const p=t.final||{};
  L.push("ÉTAT · "+f(p.horloge?p.horloge.minutes:0)+" min · tours "+(p.horloge?p.horloge.tours:0)+" · temps passés "+((p.trame&&p.trame.passes)||[]).map(x=>x.id+"("+x.cause+")").join(", ")+" · fin "+((p.trame&&p.trame.fin)||"—")+" · peur "+(p.porteur?p.porteur.peur:"")+" confiance "+(p.porteur?p.porteur.confiance:"")+" agacement "+(p.porteur?p.porteur.agacement:""));
  return dernierJournal=L.join("\n");
}
function montrerJournal(){ $("mesure-txt").textContent=journal()||"Aucune partie jouée."; $("mesure").hidden=false; $("mesure-copier").disabled=false; }
{ const b=document.createElement("button"); b.type="button"; b.id="journal"; b.className="ghost"; b.textContent="Journal"; b.hidden=true; $("parler").after(b); b.onclick=montrerJournal;
  const c=document.createElement("button"); c.type="button"; c.className="ghost"; c.textContent="Journal de la partie"; $("fin-quitter").after(c); c.onclick=montrerJournal; }

/* ------------------------------------------------------------------ API : ce qu'un metteur en scène (IA ou script) peut piloter */
window.balade={
