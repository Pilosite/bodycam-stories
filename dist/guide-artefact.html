ctd>look while moving\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Places\u003c/th>\u003ctd>one place, described by a pack\u003c/td>\u003ctd>several places, travel between them\u003c/td>\u003ctd>any place from a prompt, live\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Things\u003c/th>\u003ctd>anything expressible in the current shape/material vocabulary, within reach\u003c/td>\u003ctd>articulated things, containers, fire, liquids\u003c/td>\u003ctd>open vocabulary growth by models\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Character\u003c/th>\u003ctd>one strong character, acts in place\u003c/td>\u003ctd>autonomous initiative, moves on her own\u003c/td>\u003ctd>several characters, creatures\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Sound\u003c/th>\u003ctd>synthesized cues and voice, driven by PDL\u003c/td>\u003ctd>ambience beds, spatial sound\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">PDL\u003c/th>\u003ctd>transactions, three horizons, rules, source format with strengths\u003c/td>\u003ctd>richer events, time-based rules\u003c/td>\u003ctd>a public, versioned standard\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Commitments (planning ahead through the character)\u003c/th>\u003ctd>conditional requests become promises and rules within a session, kept or broken in character\u003c/td>\u003ctd>commitments that persist across sessions; creators define moments that invite them\u003c/td>\u003ctd>players' commitments shared and reused as story material\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Model tiers\u003c/th>\u003ctd>reflex (code), translation, staging, background, behind one adapter; judgement (\u003ccode>decide\u003c/code>) separate from invention (P22); a home node on Toine's desktop for real tiers (ADR 0008)\u003c/td>\u003ctd>on-device small model for translation; hosted decision models\u003c/td>\u003ctd>specialised non-generative models per modality\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Anticipation\u003c/th>\u003ctd>frontier of likely intents per station, measured\u003c/td>\u003ctd>speculative pre-rendering of next views\u003c/td>\u003ctd>continuous background world growth\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Creator tools\u003c/th>\u003ctd>session viewer, rule what-if, principle audit, pack checker\u003c/td>\u003ctd>assistant-driven authoring commands\u003c/td>\u003ctd>hosted creator workspace\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Collaboration\u003c/th>\u003ctd>layered packs in Git with provenance\u003c/td>\u003ctd>shared packs, forks and merges with tooling\u003c/td>\u003ctd>live shared narrative spaces\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Languages\u003c/th>\u003ctd>backend English; English is the primary play language, French fully available, speech with subtitles; one override setting\u003c/td>\u003ctd>more languages\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Platform\u003c/th>\u003ctd>desktop browser\u003c/td>\u003ctd>phone\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">The satire demo\u003c/th>\u003ctd>kept apart as a sandbox, off the main path\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>"},"milestones":"\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003c/th>\u003cth scope=\"col\">Milestone\u003c/th>\u003cth scope=\"col\">Exit criterion\u003c/th>\u003cth scope=\"col\">How to check\u003c/th>\u003cth scope=\"col\">Measured\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">M0\u003c/th>\u003ctd>Foundations\u003c/td>\u003ctd>Architecture, scope, SDLC and ADRs accepted; \u003ccode>main\u003c/code> green; CI running\u003c/td>\u003ctd>\u003ccode>npm test\u003c/code> passes; the CI workflow is green on \u003ccode>main\u003c/code>; \u003ccode>docs/adr/\u003c/code> holds 0001 to 0007 (0004 may still be a placeholder)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">M1\u003c/th>\u003ctd>Core and story on paper\u003c/td>\u003ctd>The story pack loads; a full session of &quot;Louis's Round&quot; runs in the paper world with canned model answers and replays to the same hash\u003c/td>\u003ctd>The golden replay test passes in CI; replaying the recorded journal twice gives an identical final state hash\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">M2\u003c/th>\u003ctd>Playable without models\u003c/td>\u003ctd>The engine implements the executor; stations and transitions; playable with reflex and fallback lines only\u003c/td>\u003ctd>The contract suite passes on both the paper world and the engine adapter; one smoke run plays the recorded journal in a browser with no error and the screenshot is looked at\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">M3\u003c/th>\u003ctd>Model tiers\u003c/td>\u003ctd>Translation and staging tiers live behind the adapter, principles in their prompts; first-reaction and full-reaction latencies measured\u003c/td>\u003ctd>Run the latency script against the proxy; read p50 and p95 per tier from the journal timings\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">M4\u003c/th>\u003ctd>Background and rules\u003c/td>\u003ctd>A rule written by a model mid-session fires later in code; the frontier serves a measured share of requests\u003c/td>\u003ctd>Find in the journal a model-authored \u003ccode>rule\u003c/code> followed by its firing with no model call; compute the frontier hit rate over a bench run\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">M5\u003c/th>\u003ctd>Creator loop\u003c/td>\u003ctd>Session viewer, principle audit, one rule edited and the session replayed; two layers merged with provenance\u003c/td>\u003ctd>Open a journal in the viewer; edit a rule and replay, see the diff; merge two layers and check the author on each field\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">M6\u003c/th>\u003ctd>Proof\u003c/td>\u003ctd>The bench score, the four measurements, a three-minute video, the list of what is v2\u003c/td>\u003ctd>Run the 50-request bench per story and record the score; check the four measurements are in this table; watch the video; read the v2 list in \u003ccode>docs/scope.md\u003c/code>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>","decisions":[{"id":"D1","clock":"now","question":"What is the player asking? (intent class and target, among the closed vocabulary)","type":"choice","code":"builds the \u003ccode>intent\u003c/code> transaction; asked only when the nearest-match on embeddings is below its threshold"},{"id":"D2","clock":"now","question":"Is it for now, or for later under a condition?","type":"bool","code":"routes to a commitment instead of an act"},{"id":"D3","clock":"now","question":"Does she go along? (accept, amend, refuse, argue), given her tendencies in scope","type":"choice","code":"picks the reaction family; the line itself is a bank line or an invention"},{"id":"D4","clock":"scene","question":"Does this proposed transaction break a principle in scope that code cannot check (\u003ccode>!\u003c/code> not yet compiled, strong \u003ccode>~\u003c/code>)?","type":"bool","code":"accept, or repair toward the intent; on \u003ccode>!!\u003c/code> the question is asked in both orders"},{"id":"D5","clock":"scene","question":"Is this fuzzy condition true now? (&quot;too often&quot;, &quot;close&quot;, &quot;she has had enough&quot;) when no gauge answers it","type":"bool or score","code":"fires or holds a rule's \u003ccode>if\u003c/code>; a gauge, when one exists, answers in code instead"},{"id":"D6","clock":"scene","question":"Has what the player planned for just happened? (a commitment's condition, stated in words)","type":"bool","code":"marks the commitment \u003ccode>due\u003c/code>"},{"id":"D7","clock":"scene","question":"Did she keep her word?","type":"choice","code":"\u003ccode>kept\u /* A canned model (ModelPort test adapter, docs/sdlc.md §3: "no mocking beyond a fixed canned answer").
   answers: { <question or purpose>: value | (request) => value }. hold: purposes whose answer waits for release(purpose),
   to stand for a slow tier. Every call is recorded in `calls`. */
function createCannedModel(answers = {}, { hold = [] } = {}) {
  const calls = [], waiting = new Map();
  const answer = (key, req) => { const a = answers[key]; if (a === undefined) throw new Error('canned model: no answer for ' + key); return typeof a === 'function' ? a(req) : a; };
  const m = {
    calls,
    embed: async texts => { calls.push(['embed', texts]); return texts.map(t => [...t].slice(0, 8).map(c => c.charCodeAt(0) / 255)); },
    decide: async req => { calls.push(['decide', req]); return answer(req.question, req); },
    generate: req => {
      calls.push(['generate', req]);
      if (!hold.includes(req.purpose)) return Promise.resolve(answer(req.purpose, req));
      return new Promise(ok => waiting.set(req.purpose, () => ok(answer(req.purpose, req))));
    },
    release(purpose) { const f = waiting.get(purpose); if (!f) return false; waiting.delete(purpose); f(); return true; },
    pending: () => [...waiting.keys()],
  };
  return m;
}
return { createCannedModel };

  take: { primary: 'target', fields: { target: T.ref(['thing'], { req: true, intent: 'target', reach: true }) } },

  'sound.play': { primary: 'cue', fields: { cue: T.cue({ req: true }), at: T.ref(['thing', 'body', 'station'], { def: 'body' }), gain: T.num(0, 0.9, { def: 0.5 }) } },

M["world"] = (function () {

const clone = o => JSON.parse(JSON.stringify(o));
const r4 = x => Math.round(x * 1e4) / 1e4;

/* A world from a scene description (the place part of a story pack). */
function createWorld(scene, { seed = 1 } = {}) {

   The core imports nothing from the engine, the DOM, the models, the input device or storage: each is an adapter that
   implements one of these plain interfaces. Test adapters: core/paper-world.js (engine), core/canned-model.js (model). */


const PORTS = {
  /* engine: the executor (§9.1). Each call (args, ctx) → events. */
  engine: EXECUTOR_METHODS,
  /* model (ADR 0004): three entry points, provider-agnostic; tiers are roles (fast, mid, large), chosen in configuration.
       embed(texts: string[])                                   → Promise<number[][]>
       decide({ tier, question, options?, state? })             → Promise<{ answer, p?, uncertain? }>   a typed judgement
       generate({ tier, purpose, context })                     → Promise<{ tokens }>   PDL token text (§10), validated after */
  model: ['embed', 'decide', 'generate'],
  /* input: what the player does, pushed to the clocks.
       subscribe(handler) with handler({ kind: 'speech', text, lang, loud? } | { kind: 'look', target, s }) → unsubscribe() */
  input: ['subscribe'],
  /* store: packs and journals (Git files in v1).
       readPack(id) → { manifest, texts, place, stations, beats, lines }; readLibrary() → { id: text };
       appendJournal(sessionId, entries); readJournal(sessionId) → entries */
  store: ['readPack', 'readLibrary', 'appendJournal', 'readJournal'],
};

/* The methods an adapter is missing for a port ([] when it implements it). */
function missing(port, impl) { return (PORTS[port] || []).filter(m => !impl || typeof impl[m] !== 'function'); }
return { PORTS, missing };
})();
